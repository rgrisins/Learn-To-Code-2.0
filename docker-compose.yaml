services:
  # Pre-pull sandbox images vienreiz, lai pirmajā koda izpildē nav jāgaida
  # docker pull (kas pārsniedz 5 sekunžu izpildes timeout).
  sandbox-images:
    image: docker:cli
    container_name: learn_sandbox_pull
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command: >
      "docker image inspect python:3.11-slim >/dev/null 2>&1 || docker pull python:3.11-slim;
       docker image inspect eclipse-temurin:21-jdk >/dev/null 2>&1 || docker pull eclipse-temurin:21-jdk"

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: learn_api
    restart: unless-stopped
    ports:
      - "192.168.50.242:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      sandbox-images:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-988}"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Redis__Connection: redis:6379,password=${REDIS_PASSWORD}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__UseSsl: "false"
      Theory__Storage__BucketName: learn-to-code
      Theory__Storage__Prefix: theory
      Theory__Storage__AutoCreateBucket: "true"
      Theory__Storage__CacheSeconds: "60"

  ui:
    build:
      context: ./UI
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.learn-to-code.lat
    container_name: learn_ui
    restart: unless-stopped
    ports:
      - "192.168.50.242:5173:80"
    depends_on:
      - api

  postgres:
    image: postgres:17
    container_name: learn_postgres
    restart: unless-stopped
    ports:
      - "192.168.50.242:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: learn_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "192.168.50.242:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: learn_minio
    restart: unless-stopped
    ports:
      - "192.168.50.242:9000:9000"
      - "192.168.50.242:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: learn_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - ui

volumes:
  postgres_data:
  redis_data:
  minio_data:
